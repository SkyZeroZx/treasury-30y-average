spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: treasury
  webflux:
    problemdetails:
      enabled: true

alpha-vantage:
  base-url: https://www.alphavantage.co
  # Empty default so a missing variable fails the startup check instead of binding the literal placeholder.
  api-key: ${ALPHA_VANTAGE_API_KEY:}
  timeout: 10s
